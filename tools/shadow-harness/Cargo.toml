[package]
name = "shadow-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
mind-orchestration = { path = "../../crates/mind-orchestration" }
mind-domain = { path = "../../crates/mind-domain" }
observation-ingest = { path = "../../crates/observation-ingest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strategic-state = { path = "../../crates/strategic-state" }

[workspace]
resolver = "3"
