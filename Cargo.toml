[workspace]
members = [
    "crates/observation-domain",
    "crates/observation-ingest",
    "crates/observation-persistence",
    "crates/strategic-state",
    "crates/mind-domain",
    "crates/mind-persistence",
    "crates/mind-orchestration",
    "crates/x4-bridge",
    "tools/source-size-lint",
]
resolver = "3"

[workspace.lints.rust]
non_ascii_idents = "forbid"
unsafe_code = "forbid"
unfulfilled_lint_expectations = "deny"
warnings = { level = "deny", priority = -2 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "allow", priority = -1 }
pedantic = { level = "deny", priority = -1 }

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
await_holding_lock = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
mem_forget = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

cognitive_complexity = "deny"
excessive_nesting = "deny"
too_many_lines = "deny"

# Audited non-cosmetic nursery lints for pinned Rust 1.97.1.
as_ptr_cast_mut = "deny"
branches_sharing_code = "deny"
clear_with_drain = "deny"
coerce_container_to_any = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
fallible_impl_from = "deny"
future_not_send = "deny"
imprecise_flops = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
iter_with_drain = "deny"
large_stack_frames = "deny"
literal_string_with_formatting_args = "deny"
missing_const_for_fn = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
needless_type_cast = "deny"
non_send_fields_in_send_ty = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
redundant_pub_crate = "deny"
search_is_some = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
single_option_map = "deny"
string_lit_as_bytes = "deny"
suboptimal_flops = "deny"
suspicious_operation_groupings = "deny"
trailing_empty_array = "deny"
trait_duplication_in_bounds = "deny"
transmute_undefined_repr = "deny"
trivial_regex = "deny"
tuple_array_conversions = "deny"
type_repetition_in_bounds = "deny"
uninhabited_references = "deny"
unnecessary_struct_initialization = "deny"
unused_peekable = "deny"
unused_rounding = "deny"
useless_let_if_seq = "deny"
volatile_composites = "deny"
while_float = "deny"

# Entirely cosmetic or documentation-only requirements do not block delivery.
cargo_common_metadata = "allow"
doc_link_code = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
nonstandard_macro_braces = "allow"
option_if_let_else = "allow"
too_long_first_doc_paragraph = "allow"
use_self = "allow"

# Explicit safety and performance gates retained from the strict baseline.
large_futures = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
